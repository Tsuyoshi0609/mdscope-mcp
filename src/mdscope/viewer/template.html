<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --bar: #f2f2f2; --border: #d0d0d0; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #e8e8e8; --bar: #1e1e1e; --border: #3a3a3a; --accent: #60a5fa; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--border); }
  #bar b { font-size: 15px; }
  #bar .meta { opacity: .7; }
  #bar label { display: inline-flex; gap: 4px; align-items: center; }
  select, button { font: inherit; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); }
  button:hover { border-color: var(--accent); }
  #viewer { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  #wrap { position: relative; height: calc(100% - 46px); }
  @media (max-width: 600px) { #wrap { height: calc(100% - 88px); } }
  #notes { position: absolute; left: 10px; bottom: 8px; font-size: 12px; opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<div id="bar">
  <b id="title"></b>
  <span class="meta" id="meta"></span>
  <label>Style <select id="style">
    <option value="cartoon">cartoon</option><option value="sticks">sticks</option>
    <option value="spheres">spheres</option><option value="lines">lines</option></select></label>
  <label>Color <select id="color">
    <option value="ss">secondary structure</option><option value="chain">chain</option>
    <option value="rainbow">rainbow (N→C)</option><option value="element">element</option></select></label>
  <button id="reset">Reset view</button>
</div>
<div id="wrap"><div id="viewer"></div><div id="notes"></div></div>

<script type="application/json" id="payload">__PAYLOAD_JSON__</script>
<script>/*__3DMOL__*/</script>
<script>
(function () {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

  document.getElementById("title").textContent = P.title;
  document.getElementById("meta").textContent =
    `${P.n_residues} residues · ${P.n_atoms} atoms · selection "${P.selection}"` +
    (P.n_frames_total > 1 ? ` · frame ${P.frame}/${P.n_frames_total - 1}` : "");
  document.getElementById("notes").textContent = (P.notes || []).join(" · ");

  const viewer = $3Dmol.createViewer(document.getElementById("viewer"),
    { backgroundColor: dark ? "#121212" : "#ffffff", antialias: true });
  const model = viewer.addModel(P.pdb, "pdb");

  const styleSel = document.getElementById("style");
  const colorSel = document.getElementById("color");
  styleSel.value = P.style;
  colorSel.value = P.color;

  // 3Dmol atom-style for one representation under one coloring
  function rep(style, color) {
    const c = {};
    if (color === "ss") c.colorscheme = "ssPyMOL";
    else if (color === "chain") c.colorscheme = "chain";
    else if (color === "rainbow") c.color = "spectrum";
    else c.colorscheme = "default";              // element colors
    if (style === "cartoon") return { cartoon: Object.assign({}, c) };
    if (style === "sticks")  return { stick: Object.assign({ radius: 0.2 }, c) };
    if (style === "spheres") return { sphere: Object.assign({ scale: 0.3 }, c) };
    return { line: Object.assign({}, c) };
  }

  const HETERO = { hetflag: true, not: { resn: ["HOH", "WAT", "SOL", "TIP3"] } };

  function applyStyle() {
    const style = styleSel.value, color = colorSel.value;
    viewer.setStyle({}, rep(style, color));
    if (style === "cartoon") {
      // cartoon cannot draw ligands or lone residues; show them as sticks
      viewer.setStyle(HETERO, { stick: { radius: 0.25, colorscheme: "default" } });
      if (!model.selectedAtoms({ ss: ["h", "s"] }).length) {
        // no secondary structure at all (peptide, small molecule): fall back to sticks
        viewer.setStyle({}, rep("sticks", color === "ss" ? "element" : color));
      }
    }
    if (P.highlight_serials && P.highlight_serials.length) {
      viewer.addStyle({ serial: P.highlight_serials },
        { stick: { radius: 0.3, colorscheme: "magentaCarbon" } });
    }
    viewer.render();
  }

  styleSel.addEventListener("change", applyStyle);
  colorSel.addEventListener("change", applyStyle);
  document.getElementById("reset").addEventListener("click", () => { viewer.zoomTo(); viewer.render(); });
  window.addEventListener("resize", () => viewer.resize());

  applyStyle();
  viewer.zoomTo();
  viewer.render();
})();
</script>
</body>
</html>

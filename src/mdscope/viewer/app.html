<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdscope viewer</title>
<style>/*__CSS__*/</style>
<style>
  html, body { min-height: 420px; }
  #fullscreen { margin-left: auto; }
</style>
</head>
<body>
<div id="bar">
  <b id="title">mdscope</b>
  <span class="meta" id="meta"></span>
  <label>Style <select id="style"></select></label>
  <label>Color <select id="color"></select></label>
  <button id="reset">Reset view</button>
  <button id="theme" title="Light / dark">◐</button>
  <button id="fullscreen" title="Toggle fullscreen">⤢</button>
</div>
<div id="layerbar">
  <span id="layers"></span>
  <span class="add">
    <input id="addsel" placeholder="residues: 10-20, A:30, LIG" size="18">
    <select id="addstyle"></select><select id="addcolor"></select>
    <button id="add">Add layer</button>
  </span>
  <button id="clearlabels" title="Click an atom to label its residue">Clear labels</button>
</div>
<div id="wrap"><div id="viewer"><div id="status">waiting for structure data…</div></div><div id="notes"></div></div>
<div id="ctrl">
  <button id="play" title="Play / pause (space)">▶</button>
  <input type="range" id="frame" min="0" max="0" value="0" step="1">
  <span id="flabel"></span>
  <label>Speed <select id="fps">
    <option value="2">2 fps</option><option value="5">5 fps</option><option value="10" selected>10 fps</option>
    <option value="20">20 fps</option><option value="30">30 fps</option></select></label>
</div>

<script>/*__3DMOL__*/</script>
<script>/*__CORE__*/</script>
<script>
// MCP App bridge. Two hosts are supported without a build step:
//  (a) MCP Apps (postMessage JSON-RPC): ui/initialize -> ui/notifications/tool-result
//  (b) ChatGPT legacy globals: window.openai.toolResponseMetadata / toolOutput
(function () {
  const PAYLOAD_KEY = "mdscope/payload";
  const PROTOCOL = "2026-01-26";
  let api = null, mounted = false, resolving = false, displayMode = "inline";
  const status = (t) => { const s = document.getElementById("status"); if (s) s.textContent = t; };

  // --- find the viewer payload anywhere in a tool result envelope -----------------
  function findPayload(obj, depth) {
    if (!obj || typeof obj !== "object" || depth > 6) return null;
    if (obj[PAYLOAD_KEY] && obj[PAYLOAD_KEY].pdb) return obj[PAYLOAD_KEY];
    for (const k of Object.keys(obj)) {
      const r = findPayload(obj[k], depth + 1);
      if (r) return r;
    }
    return null;
  }

  function show(payload, dark) {
    if (!payload || mounted) return;
    mounted = true;
    try {
      api = MdscopeViewer.mount(payload, { dark });
    } catch (e) {
      document.getElementById("viewer").innerHTML = '<div id="status"></div>';
      status("viewer error: " + (e && e.message) + ". Open the HTML file / URL from the tool result instead.");
    }
    notifySize();
  }

  // --- (a) MCP Apps JSON-RPC over postMessage ------------------------------------
  let nextId = 1;
  const pending = new Map();
  function send(msg) { window.parent.postMessage(Object.assign({ jsonrpc: "2.0" }, msg), "*"); }
  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      send({ id, method, params });
    });
  }
  function notify(method, params) { send({ method, params }); }
  function notifySize() {
    const h = document.getElementById("ctrl").classList.contains("on") ? 540 : 500;
    notify("ui/notifications/size-changed", { height: displayMode === "fullscreen" ? undefined : h });
    if (window.openai && window.openai.notifyIntrinsicHeight) window.openai.notifyIntrinsicHeight(h);
  }

  let hostDark = null;
  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) { hostDark = ctx.theme === "dark"; if (api) api.setDark(hostDark); else MdscopeViewer.setTheme(hostDark); }
    if (ctx.displayMode) { displayMode = ctx.displayMode; if (api) setTimeout(() => api.resize(), 50); }
  }

  function callTool(name, args) {
    if (window.openai && window.openai.callTool) return window.openai.callTool(name, args);
    return request("tools/call", { name, arguments: args });
  }
  function chunkOf(r) {
    if (r && r.structuredContent && typeof r.structuredContent.data === "string") return r.structuredContent;
    const t = r && r.content && r.content[0] && r.content[0].text;
    return t ? JSON.parse(t) : null;
  }
  async function fetchByViewId(viewId) {
    // the host stripped _meta or cut it short: fetch the saved payload in pieces (app-only tool)
    try {
      let text = "", offset = 0, total = 1;
      while (offset < total) {
        const c = chunkOf(await callTool("get_view_payload", { view_id: viewId, offset }));
        if (!c || !c.data) throw new Error("empty piece at offset " + offset);
        text += c.data; offset += c.data.length; total = c.total;
        status(`loading structure… ${Math.round(100 * offset / total)}%`);
      }
      return JSON.parse(text);
    } catch (e) { status("could not load structure: " + (e && e.message)); return null; }
  }

  function viewIdOf(obj, depth) {
    if (!obj || typeof obj !== "object" || depth > 6) return null;
    if (typeof obj.view_id === "string") return obj.view_id;
    for (const k of Object.keys(obj)) {
      const r = viewIdOf(obj[k], depth + 1);
      if (r) return r;
    }
    return null;
  }
  async function resolve(result) {
    let p = findPayload(result, 0);
    if (p && !MdscopeViewer.isComplete(p)) p = null;   // e.g. Codex keeps only the ends of a long result
    const vid = viewIdOf(result, 0);
    if (!p && vid) {
      status("loading structure…");
      p = await fetchByViewId(vid);
    }
    return p;
  }
  async function onToolResult(result) {
    const p = await resolve(result);
    if (p) show(p, hostDark); else status("tool result has no structure data");
  }

  window.addEventListener("message", (ev) => {
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id)) {
      const { resolve, reject } = pending.get(m.id); pending.delete(m.id);
      m.error ? reject(new Error(m.error.message || "error")) : resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") onToolResult(m.params);
    else if (m.method === "ui/notifications/host-context-changed") applyContext(m.params);
    else if (m.method === "ui/notifications/request-teardown") { /* nothing to persist */ }
  });

  document.getElementById("fullscreen").onclick = async () => {
    const mode = displayMode === "fullscreen" ? "inline" : "fullscreen";
    if (window.openai && window.openai.requestDisplayMode) {
      try { const r = await window.openai.requestDisplayMode({ mode }); applyContext({ displayMode: (r && r.mode) || mode }); } catch (e) {}
      return;
    }
    try { const r = await request("ui/request-display-mode", { mode }); applyContext({ displayMode: (r && r.mode) || mode }); } catch (e) {}
  };

  // --- (b) ChatGPT legacy globals --------------------------------------------------
  function tryOpenAI() {
    const o = window.openai;
    if (!o) return false;
    applyContext({ theme: o.theme, displayMode: o.displayMode });
    const res = { meta: o.toolResponseMetadata, out: o.toolOutput };
    if (!findPayload(res, 0) && !viewIdOf(res, 0)) return false;
    if (resolving) return true;
    resolving = true;
    resolve(res).then((p) => { if (p) show(p, hostDark); else status("tool result has no structure data"); });
    return true;
  }
  window.addEventListener("openai:set_globals", () => { if (!mounted) tryOpenAI(); else if (window.openai) applyContext({ theme: window.openai.theme, displayMode: window.openai.displayMode }); });

  // --- start ---------------------------------------------------------------------
  if (!tryOpenAI()) {
    request("ui/initialize", {
      protocolVersion: PROTOCOL,
      appInfo: { name: "mdscope-viewer", version: "0.0.1" },
      appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
    }).then((res) => {
      applyContext(res && res.hostContext);
      notify("ui/notifications/initialized", {});
    }).catch((e) => status("host did not answer ui/initialize: " + (e && e.message)));
  }
})();
</script>
</body>
</html>
